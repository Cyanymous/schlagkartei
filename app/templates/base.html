<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Schlagkartei{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Schlagkartei</span>
    {% set pfad = request.url.path %}
    <nav>
      <a href="/" {% if pfad == "/" or pfad.startswith("/anwendung") %}class="aktiv"{% endif %}>Übersicht</a>
      <a href="/import" {% if pfad.startswith("/import") %}class="aktiv"{% endif %}>Import-Status</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
